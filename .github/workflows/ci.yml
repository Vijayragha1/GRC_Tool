name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Install dependencies without an implicit browser download. The
      # compatible browser is installed explicitly and visibly below because
      # the route suite exercises production PDF generation.
      PUPPETEER_SKIP_DOWNLOAD: '1'
      # Earlier suites can create an empty repo-root database as a side effect.
      # Always make the standalone walkers build their own migrated seed data.
      FORCE_BUILT_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the production Docker runtime. better-sqlite3 currently
          # crashes during process cleanup on the Linux Node 24 runner.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser for PDF generation tests
        run: npx --no-install puppeteer browsers install chrome-headless-shell
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Framework content staleness gate
        run: npm run content-staleness
      # The live iso27001.db is gitignored; the suites detect its absence and
      # build a migrated, seeded DB via scripts/build-test-db.js.
      - run: npm test
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            npm-debug.log
          if-no-files-found: ignore

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n deploy/update.sh
          bash -n deploy/lightsail-setup.sh
      - name: Build the production image
        run: docker build --tag iso27001-tool:ci .
      - name: Start the production image
        run: |
          docker run --detach --name nimbus-ci \
            --publish 127.0.0.1:3300:3000 \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env APP_VERSION="$GITHUB_SHA" \
            --env APP_BASE_URL=https://ci.invalid \
            --env RESEND_API_KEY=ci-placeholder-key \
            --env SESSION_SECRET=ci-only-session-secret-0123456789abcdefghijklmnopqrstuvwxyz \
            --env ISMS_MASTER_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff \
            --env UPLOAD_AV_MODE=required \
            iso27001-tool:ci
      - name: Require production readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3300/readyz > ready.json; then
              grep -q "\"version\":\"$GITHUB_SHA\"" ready.json
              exit 0
            fi
            sleep 2
          done
          docker logs nimbus-ci
          exit 1
      - name: Verify graceful container stop
        run: |
          docker stop --time 20 nimbus-ci
          test "$(docker inspect --format='{{.State.ExitCode}}' nimbus-ci)" = "0"
      - name: Capture container output
        if: always()
        run: docker logs nimbus-ci > container-smoke.log 2>&1 || true
      - name: Upload container output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-output
          path: |
            container-smoke.log
            ready.json
          if-no-files-found: ignore
      - name: Remove smoke container
        if: always()
        run: docker rm --force nimbus-ci >/dev/null 2>&1 || true
