<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Compliance Sphere</title>
  <!--
    Compliance Sphere mark - three concentric circles forming a target /
    sphere abstraction. Stroked heavier than the in-app mark (1.8 vs 1.3)
    so the glyph stays legible at 16x16 favicon size in the browser tab.
    White-on-charcoal pill so it reads on light and dark browser themes
    without depending on the page background.
  -->
  <rect width="32" height="32" rx="7" fill="#1a1a1a"/>
  <circle cx="16" cy="16" r="11"  fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="16" cy="16" r="7"   fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="16" cy="16" r="2.8" fill="#ffffff"/>
</svg>
