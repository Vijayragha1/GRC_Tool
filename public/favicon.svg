<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>ISMS</title>
  <!--
    Premium-feel favicon. Oxblood (#5C0A0A) matches the in-app --accent
    var; serif "I" matches the Source Serif 4 wordmark used everywhere
    else in the product (sidebar brand, /login, /approve portal, email
    templates). Path-based glyph rather than font-based so the serif
    caps render identically in every browser regardless of font loading.
  -->
  <rect width="32" height="32" rx="6" fill="#5C0A0A"/>
  <rect x="9" y="7" width="14" height="2.6" fill="#ffffff"/>
  <rect x="14.4" y="7" width="3.2" height="18" fill="#ffffff"/>
  <rect x="9" y="22.4" width="14" height="2.6" fill="#ffffff"/>
</svg>
